name: Improvement (The Rerun)
description: Suggest one improvement to The Rerun. Required for its extra credit.
title: "Rerun improvement: "
labels: ["rerun-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing The Rerun. This repository is **public** and shows your GitHub username.
        Leave out names, NetIDs, email addresses, grades and other personal information.
        Paste the issue link with your three RERUN codes into the Canvas assignment.

        **What counts for the extra credit.** The issue must propose one specific change to the game
        and say what happened while you played that made you want it. Praise alone ("it's good",
        "no changes") does not count. A good issue:
        - Has a title that names the change, for example "Floor 2: show the day number next to the buttons".
        - Says exactly what should be different: which button, text, table or message.
        - Gives the moment that caused it: what you tried, what you expected, what you saw.
        - Covers one change. File a second issue for a second idea.
        Good examples: [#34](https://github.com/Business-Analytics-at-Gies/badm554-taxi-crawler/issues/34), [#36](https://github.com/Business-Analytics-at-Gies/badm554-taxi-crawler/issues/36).
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: ["Floor 1: Run it twice", "Floor 2: A new day", "Floor 3: Late corrections and rebuild", "The tutor", "The guide", "Pipeline and Scratch", "Something else"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: Describe one concrete change. Name the button, text, table or message, and what it should do instead.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What happened while you played? What did you try, what did you expect, and what did you see?
    validations:
      required: true
